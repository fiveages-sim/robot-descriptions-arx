/**:
  ros__parameters:
    # 线性控制缩放因子（用于手柄/键盘控制）
    linear_scale: 0.3
    
    # 角度控制缩放因子（用于手柄/键盘控制）
    angular_scale: 0.5


    use_teleop_target_manager: false

    # 是否启用VR输入处理
    enable_vr: true

    # Must match model_information.baseFrame in task.info / TF Fixed Frame in RViz
    marker_fixed_frame: base_link
